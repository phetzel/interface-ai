name: interface-ai

services:
  fixture:
    profiles: [bank]
    image: interface-ai-bank-fixture:local
    build:
      context: apps/bank-fixture
    init: true
    environment:
      FIXTURE_SCENARIO: ${FIXTURE_SCENARIO:-default}
    networks: [desktop]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128mb
    cpus: 0.5
    pids_limit: 64
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:4173/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 5s
      retries: 5

  desktop:
    image: interface-ai-desktop:local
    build:
      context: .
      dockerfile: infra/desktop/Dockerfile
    init: true
    shm_size: 256mb
    mem_limit: 2g
    cpus: 2
    pids_limit: 256
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
      - seccomp:./infra/desktop/chromium-seccomp.json
    environment:
      DESKTOP_APP: ${DESKTOP_APP:-native}
      DISPLAY: :99
      XAUTHORITY: /tmp/interface-ai/Xauthority
      XDG_SESSION_TYPE: x11
      DESKTOP_WIDTH: "1280"
      DESKTOP_HEIGHT: "800"
    volumes:
      - ./tmp/desktop-artifacts:/artifacts
    networks: [desktop]
    healthcheck:
      test: [CMD, /opt/venv/bin/python, /opt/desktop/control.py, ready]
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 15s
    stop_grace_period: 10s

  viewer:
    image: interface-ai-desktop:local
    pull_policy: never
    entrypoint: [python, /opt/desktop/viewer_relay.py]
    init: true
    depends_on:
      desktop:
        condition: service_healthy
    ports:
      - "127.0.0.1:${DESKTOP_PORT:-6080}:6080"
    networks: [desktop, viewer]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128mb
    cpus: 0.5
    pids_limit: 64
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:6080/vnc.html', timeout=2).close()"]
      interval: 3s
      timeout: 5s
      retries: 5

networks:
  desktop:
    internal: true
  viewer:
