[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "interface-ai"
version = "0.1.0"
description = "Desktop execution primitives for the interface-ai assignment"
requires-python = ">=3.11,<3.12"
dependencies = ["PyAutoGUI==0.9.54", "Pillow==11.3.0", "opencv-python-headless==4.12.0.88", "numpy==2.2.6", "pydantic==2.12.5"]

[project.scripts]
interface-ai = "interface_ai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"interface_ai.vision" = ["anchors/*.png", "anchors/*.json"]
