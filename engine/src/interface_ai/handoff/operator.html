<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Interface AI · Operator</title>
    <style>
      /*__STYLES__*/
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Interface AI <span class="hint">/ Operator</span></h1>
        <span id="state">Connecting…</span>
      </header>
      <p id="session"></p>
      <div class="controls">
        <label>Member <input id="member" value="00123" maxlength="5" size="6" /></label>
        <button id="start" class="primary" disabled>Start lookup</button
        ><button id="takeover" disabled>Take control</button>
        <button id="resume" disabled>Verify &amp; resume</button
        ><button id="stop" class="danger" disabled>Stop</button>
      </div>
      <p id="guidance">Loading desktop state…</p>
      <p id="diagnostic" class="hint"></p>
      <p id="message" role="status"></p>
      <div class="controls">
        <label
          >Text to send
          <input
            id="text"
            type="password"
            autocomplete="off"
            maxlength="256"
            placeholder="Synthetic data only"
        /></label>
        <button id="send" disabled>Send text</button><button data-key="enter" disabled>Enter</button
        ><button data-key="tab" disabled>Tab</button
        ><button data-key="backspace" disabled>Backspace</button
        ><button id="select" disabled>Select all</button>
      </div>
      <img
        id="screen"
        alt="Live isolated desktop. Click to interact when you own control."
        draggable="false"
      />
      <p class="hint">
        Click the desktop to focus a field or button, then send text with the controls above. Human
        action types are recorded; text, keys and screenshots are not saved. This panel controls the
        same desktop as the read-only viewer.
      </p>
    </main>
    <script nonce="__TOKEN__">
      /*__SCRIPT__*/
    </script>
  </body>
</html>
